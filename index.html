<!doctype html>
<html lang="en">
  <head>

    <title>KOSHA — Café &amp; Experience Studio</title>
    <meta
      name="description"
      content="KOSHA — Café &amp; Experience Studio. Meet, eat, and discover in Vasant Kunj, New Delhi."

    <meta name="msapplication-TileColor" content="#F5F0E5" />

    <!-- Critical Brand Background & Reset (Guarantees zero white flash before CSS/JS load) -->
    <style>
      html, body, #root {
        background-color: #F5F0E5 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        min-height: 100% !important;
        min-height: 100dvh !important;
        overflow-x: hidden;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
    </style>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://koshaexperience.com/" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://koshaexperience.com/" />
    <meta property="og:site_name" content="KOSHA" />
    <meta property="og:title" content="KOSHA — Café &amp; Experience Studio" />
    <meta
      property="og:description"
      content="KOSHA — Café &amp; Experience Studio. Meet, eat, and discover in Vasant Kunj, New Delhi."
    />
    <meta property="og:image" content="https://koshaexperience.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://koshaexperience.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="KOSHA — Café &amp; Experience Studio" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="KOSHA — Café &amp; Experience Studio" />

      name="twitter:description"
      content="KOSHA — Café &amp; Experience Studio. Meet, eat, and discover in Vasant Kunj, New Delhi."

    <meta name="twitter:image" content="https://koshaexperience.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="KOSHA — Café &amp; Experience Studio" />

    <!-- Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
